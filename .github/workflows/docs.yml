name: Generated docs

# plugins/INDEX.md and the README category table are generated from the plugin
# tree by `npm run gen:index`. They must never be hand-edited — this job fails
# if they drift.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freshness:
    name: plugins/INDEX.md is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci

      - run: npm run gen:index

      - run: npm run gen:skill

      - name: Fail if generated files changed
        run: |
          git diff --exit-code -- plugins/INDEX.md README.md skills/ || {
            echo "::error::Generated docs are stale."
            echo "Run 'npm run gen:index' and 'npm run gen:skill', then commit the result."
            exit 1
          }
